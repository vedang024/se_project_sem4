<!DOCTYPE html>
<html>
<head>
  <title>Faculty Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="sidebar">
    <h2>FACULTY</h2>
    <a href="faculty.html">Dashboard</a>
    <a href="faculty-courses.html">My Courses</a>
    <a href="faculty-applications.html">Applications</a>
    <a href="faculty-profile.html" class="active">Profile</a>
    <a href="faculty-timetable.html">View Timetable</a>
  </div>

  <div class="main">
    <div class="topbar">
      <span>Faculty Profile</span>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h3>Faculty Information</h3>
      <div class="admin-user-grid">
        <div>
          <label>Name</label>
          <p id="profileName" class="manage-note">-</p>
        </div>
        <div>
          <label>Department</label>
          <p id="profileDepartment" class="manage-note">-</p>
        </div>
        <div>
          <label>Designation</label>
          <p id="profileDesignation" class="manage-note">-</p>
        </div>
        <div>
          <label>Email</label>
          <p id="profileEmail" class="manage-note">-</p>
        </div>
        <div>
          <label>Phone</label>
          <p id="profilePhone" class="manage-note">-</p>
        </div>
        <div>
          <label>Research Area</label>
          <p id="profileResearch" class="manage-note">-</p>
        </div>
      </div>
    </div>

    <br>

    <div class="card">
      <h3>Change Password</h3>
      <form id="facultyPasswordForm" class="admin-user-form" novalidate>
        <div class="admin-user-grid">
          <div>
            <label for="oldPassword">Current Password</label>
            <input id="oldPassword" type="password" required>
          </div>
          <div>
            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" minlength="8" required>
          </div>
          <div>
            <label for="confirmNewPassword">Confirm New Password</label>
            <input id="confirmNewPassword" type="password" minlength="8" required>
          </div>
        </div>
        <button type="submit" style="width: 170px; justify-content: center;" class="btn btn-primary">Update Password</button>
        <p id="facultyPasswordMessage" class="admin-user-message" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/faculty-profile.js"></script>
</body>
</html>

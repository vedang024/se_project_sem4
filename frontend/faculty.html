<!DOCTYPE html>
<html>
<head>
  <title>Faculty Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="sidebar">
    <h2>FACULTY</h2>
    <a href="#">Dashboard</a>
    <a href="#">My Courses</a>
    <a href="#">Attendance</a>
    <a href="#">Grades</a>
    <a href="#">Announcements</a>
    <a href="academicsection/timetable.html">View Timetable</a>
  </div>

  <div class="main">
    <div class="topbar">
      <span>Faculty Dashboard</span>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>

    <div class="cards">
      <div class="card"><h3>CS101</h3><p>Intro to Programming</p></div>
      <div class="card"><h3>MA202</h3><p>Linear Algebra</p></div>
    </div>

    <br>

    <div class="card">
      <h3>Change Password</h3>
      <form id="facultyPasswordForm" class="admin-user-form" novalidate>
        <div class="admin-user-grid">
          <div>
            <label for="oldPassword">Current Password</label>
            <input id="oldPassword" type="password" required>
          </div>
          <div>
            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" minlength="8" required>
          </div>
          <div>
            <label for="confirmNewPassword">Confirm New Password</label>
            <input id="confirmNewPassword" type="password" minlength="8" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
        <p id="facultyPasswordMessage" class="admin-user-message" role="status" aria-live="polite"></p>
      </form>
    </div>

    <br>

    <div class="card">
      <h3>Mark Attendance</h3>
      <div class="admin-user-grid">
        <div>
          <label for="facultyCourseSelect">Course & Batch</label>
          <select id="facultyCourseSelect"></select>
        </div>
        <div>
          <label for="attendanceDate">Date</label>
          <input id="attendanceDate" type="date">
        </div>
      </div>
      <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
        <button id="loadAttendanceStudentsBtn" class="btn btn-secondary" type="button">Load Students</button>
        <button id="saveAttendanceBtn" class="btn btn-primary" type="button">Save Attendance</button>
      </div>
      <p id="facultyAttendanceMessage" class="admin-user-message" role="status" aria-live="polite"></p>
      <div class="table-wrapper" style="margin-top: 12px;">
        <table class="manage-users-table">
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Student</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="facultyAttendanceTableBody">
            <tr>
              <td colspan="3">Select a course and date, then click Load Students.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
<script src="js/auth.js"></script>
<script src="js/faculty-dashboard.js"></script>
</body>
</html>

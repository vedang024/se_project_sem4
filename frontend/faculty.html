<!DOCTYPE html>
<html>
<head>
  <title>Faculty Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="sidebar">
    <h2>FACULTY</h2>
    <a href="faculty.html" class="active">Dashboard</a>
    <a href="faculty-courses.html">My Courses</a>
    <a href="faculty-applications.html">Applications</a>
    <a href="faculty-profile.html">Profile</a>
    <a href="faculty-timetable.html">View Timetable</a>
  </div>

  <div class="main">
    <div class="topbar">
      <span>Faculty Dashboard</span>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>

    <div class="cards">
      <div class="card">
        <h3>Assigned Courses</h3>
        <p id="dashCourseCount">0</p>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <h3>My Courses</h3>
        <a href="faculty-courses.html" class="btn btn-primary btn-sm" style="max-width: 220px;font-size: 14px; ">Open My Courses</a>
      </div>
      <div id="facultyCoursePreview" class="application-list"></div>
    </div>
  </div>
</div>
<script src="js/auth.js"></script>
<script src="js/faculty-dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container">
  <div class="sidebar">
    <a href="admin.html"><h3>ADMIN</h3></a>
    <a href="admin.html">Dashboard</a>
    <a href="manage-users.html" class="active">Manage Users</a>
    <a href="departments.html">Departments</a>
    <a href="applications.html">Applications</a>
    <a href="timetable.html">Timetable</a>
  </div>

  <div class="main">
    <div class="topbar">
      <span>Manage Students & Faculty</span>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>

    <div class="card admin-user-card">
      <h3>Create New User</h3>
      <p>Create Student, Faculty, or Admin users from this section.</p>

      <form id="createUserForm" class="admin-user-form" novalidate>
        <div class="admin-user-grid">
          <div>
            <label for="newUsername">Username</label>
            <input id="newUsername" name="newUsername" type="text" placeholder="Enter username" required>
          </div>

          <div>
            <label for="newRole">Role</label>
            <select id="newRole" name="newRole" required>
              <option value="">Select role</option>
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>

        <div class="admin-user-grid">
          <div>
            <label for="newPassword">Password</label>
            <input id="newPassword" name="newPassword" type="password" placeholder="Minimum 8 characters" required>
          </div>

          <div>
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter password" required>
          </div>
        </div>

        <div class="admin-user-grid role-meta" id="roleMetaFields">
          <div id="departmentFieldWrap">
            <label for="departmentSelect">Department</label>
            <select id="departmentSelect" name="departmentSelect">
              <option value="">Select department</option>
            </select>
          </div>

          <div id="branchFieldWrap">
            <label for="branchSelect">Branch</label>
            <select id="branchSelect" name="branchSelect">
              <option value="">Select branch</option>
            </select>
          </div>

          <div id="batchFieldWrap">
            <label for="batchSelect">Batch</label>
            <select id="batchSelect" name="batchSelect">
              <option value="">Select batch</option>
            </select>
          </div>
        </div>

        <div class="admin-user-grid role-meta" id="facultyMetaFields">
          <div>
            <label for="newFacultyName">Faculty Name</label>
            <input id="newFacultyName" name="newFacultyName" type="text" placeholder="e.g. Dr. Ada Lovelace">
          </div>

          <div>
            <label for="newFacultyEmail">Faculty Email</label>
            <input id="newFacultyEmail" name="newFacultyEmail" type="email" placeholder="e.g. ada@college.edu">
          </div>
        </div>

        <button type="submit" id="createUserButton" class="btn btn-primary">Create User</button>
        <p id="createUserMessage" class="admin-user-message" role="status" aria-live="polite"></p>
      </form>
    </div>

    <br>

    <div class="card manage-toolbar">
      <div class="manage-filter-row">
        <div>
          <label for="roleFilter">Role Filter</label>
          <select id="roleFilter">
            <option value="">All</option>
            <option value="student">Students</option>
            <option value="faculty">Faculty</option>
          </select>
        </div>
        <button class="btn btn-primary" id="refreshUsersBtn" type="button">Refresh</button>
      </div>
      <p id="manageUsersMessage" class="admin-user-message" role="status" aria-live="polite"></p>
    </div>

    <div class="card manage-users-table-card">
      <div class="table-wrapper">
        <table class="manage-users-table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>Department</th>
              <th>Branch</th>
              <th>Batch</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="manageUsersBody">
            <tr>
              <td colspan="6">Loading users...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editUserModalOverlay" role="dialog" aria-modal="true" aria-labelledby="editUserModalTitle">
  <div class="modal">
    <div class="flex items-center justify-between mb-4">
      <h3 id="editUserModalTitle" class="font-semibold">Edit User</h3>
      <button class="btn-ghost p-1 rounded" id="closeEditUserModalBtn" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <form id="editUserForm" class="admin-user-form" novalidate>
      <input type="hidden" id="editUserIdInput">

      <div class="admin-user-grid">
        <div>
          <label for="editUsernameInput">Username</label>
          <input id="editUsernameInput" type="text" required>
        </div>
        <div>
          <label for="editRoleSelect">Role</label>
          <select id="editRoleSelect" required>
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
          </select>
        </div>
      </div>

      <div class="admin-user-grid">
        <div>
          <label for="editDepartmentSelect">Department</label>
          <select id="editDepartmentSelect" required>
            <option value="">Select department</option>
          </select>
        </div>
        <div id="editBranchFieldWrap">
          <label for="editBranchSelect">Branch</label>
          <select id="editBranchSelect">
            <option value="">Select branch</option>
          </select>
        </div>
        <div id="editBatchFieldWrap">
          <label for="editBatchSelect">Batch</label>
          <select id="editBatchSelect">
            <option value="">Select batch</option>
          </select>
        </div>
      </div>

      <div class="admin-user-grid" id="editFacultyMetaFields">
        <div>
          <label for="editFacultyNameInput">Faculty Name</label>
          <input id="editFacultyNameInput" type="text" placeholder="e.g. Dr. Ada Lovelace">
        </div>
        <div>
          <label for="editFacultyEmailInput">Faculty Email</label>
          <input id="editFacultyEmailInput" type="email" placeholder="e.g. ada@college.edu">
        </div>
      </div>

      <div class="admin-user-grid">
        <div>
          <label for="editNewPasswordInput">New Password</label>
          <input id="editNewPasswordInput" type="password" placeholder="Leave blank to keep current password">
        </div>
        <div>
          <label for="editConfirmPasswordInput">Confirm Password</label>
          <input id="editConfirmPasswordInput" type="password" placeholder="Re-enter new password">
        </div>
      </div>

      <p id="editUserMessage" class="admin-user-message" role="status" aria-live="polite"></p>
      <div class="flex gap-2 mt-5">
        <button type="button" class="btn btn-secondary flex-1" id="cancelEditUserBtn">Cancel</button>
        <button type="submit" class="btn btn-primary flex-1">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/manage-users.js"></script>
</body>
</html>

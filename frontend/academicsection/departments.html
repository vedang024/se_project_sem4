<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departments - Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="departments-admin-page">
<div class="container">
  <div class="sidebar">
    <a href="admin.html"><h3>ADMIN</h3></a>
    <a href="manage-users.html">Manage Users</a>
    <a href="departments.html" class="active">Departments</a>
    <a href="applications.html">Applications</a>
    <a href="timetable.html">Timetable</a>
    <a href="course-enrollment.html">Course Enrollment</a>
    <a href="view-courses-for-batch.html">View Courses for Batch</a>
    <a href="view-students-in-course.html">View Students in Course</a>
  </div>

  <div class="main">
    <div class="topbar">
      <span>Departments</span>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>

    <div class="card manage-toolbar">
      <div class="manage-filter-row">
        <div>
          <label>Department Management</label>
          <p class="manage-note">Add/edit departments and assign HOD from available faculty.</p>
        </div>
        <button class="btn btn-primary" id="addDeptBtn" type="button">Add Department</button>
      </div>
      <p id="departmentsMessage" class="admin-user-message" role="status" aria-live="polite"></p>
    </div>

    <div class="cards" id="departmentsGrid">
      <div class="card"><h3>Loading Departments...</h3></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deptModalOverlay" role="dialog" aria-modal="true" aria-labelledby="deptModalTitle">
  <div class="modal">
    <div class="flex items-center justify-between mb-4">
      <h3 id="deptModalTitle" class="font-semibold">Add Department</h3>
      <button class="btn-ghost p-1 rounded" id="closeDeptModalBtn" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <form id="deptForm" class="admin-user-form" novalidate>
      <div>
        <label for="deptNameInput">Department Name</label>
        <input id="deptNameInput" type="text" placeholder="Enter department name" required>
      </div>
      <div>
        <label for="deptHODSelect">Select HOD</label>
        <select id="deptHODSelect">
          <option value="">Select HOD (optional)</option>
        </select>
      </div>

      <div class="flex gap-2 mt-5">
        <button type="button" class="btn btn-secondary flex-1" onclick="closeDeptModal()">Cancel</button>
        <button type="submit" class="btn btn-primary flex-1">Save Department</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/departments-admin.js"></script>
</body>
</html>

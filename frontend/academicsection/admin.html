<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container">
  <div class="sidebar">
    <a href="admin.html"><h3>ADMIN</h3></a>
    <a href="admin.html" class="active">Dashboard</a>
    <a href="manage-users.html">Manage Users</a>
    <a href="departments.html">Departments</a>
    <a href="applications.html">Applications</a>
    <a href="timetable.html">Timetable</a>
    <a href="course-enrollment.html">Course Enrollment</a>
    <a href="view-courses-for-batch.html">View Courses for Batch</a>
    <a href="view-students-in-course.html">View Students in Course</a>
  </div>

  <div class="main">
    <div class="topbar">
      <span>Admin Dashboard</span>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>

    <div class="cards">
      <div class="card"><h3>Departments</h3><h2 id="departmentsCount">-</h2></div>
      <div class="card"><h3>Courses</h3><h2 id="coursesCount">-</h2></div>
      <div class="card"><h3>Faculty</h3><h2 id="facultyCount">-</h2></div>
      <div class="card text-card">
        <h3>Pending Applications</h3>
        <h2 id="pendingApplicationsCount">-</h2>
        <p id="pendingApplicationsMeta" class="dashboard-card-note">Loading inbox summary...</p>
        <div class="dashboard-card-actions">
          <a href="applications.html" class="btn btn-secondary btn-sm">Open Applications</a>
        </div>
      </div>
    </div>

    <p id="dashboardCountStatus" class="manage-note">Loading latest counts...</p>
  </div>
</div>
<script src="../js/auth.js"></script>
<script src="../js/admin-dashboard.js"></script>
</body>
</html>
